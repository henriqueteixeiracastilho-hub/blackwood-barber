<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Blackwood Barber</title>
  <link rel="stylesheet" href="style.css?v=10">
</head>
<body>

  <header>
    <nav class="navbar">
      <h1 class="logo">Blackwood <span>Barber</span></h1>
    </nav>
  </header>

  <main class="secçao-login">
    <form id="form-login" class="form-container">
      <h2>Área do Cliente</h2>
      <p>Introduza os seus dados para aceder às reservas</p>

      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" required placeholder="cliente@blackwood.pt">
      </div>

      <div class="campo">
        <label for="senha">Palavra-passe</label>
        <input type="password" id="senha" required placeholder="••••••••">
      </div>

      <button type="submit" class="btn-block">Entrar</button>
    </form>
  </main>

  <script src="login.js"></script>
</body>
</html>
