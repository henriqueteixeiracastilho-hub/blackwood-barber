<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserva - Blackwood Barber</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER -->
  <header class="main-header">
    <a href="index.html" class="logo">BLACKWOOD BARBER</a>
    <nav class="nav-links">
      <a href="index.html" class="nav-btn">Início</a>
      <a href="reserva.html" class="nav-btn active">Reservar</a>
      <a href="minhas-reservas.html" class="nav-btn">Minhas Reservas</a>
      <a href="servicos.html" class="nav-btn">Serviços</a>
      <a href="galeria.html" class="nav-btn">Galeria</a>
      <a href="admin.html" class="nav-btn">Painel Admin</a>
      <a href="login.html" class="nav-btn btn-logout">Sair</a>
    </nav>
  </header>

  <!-- CONTEÚDO DA RESERVA MAIOR E EM 2 COLUNAS -->
  <main class="page-container">
    <section class="booking-card wide-card">
      <h2>Agendar Serviço</h2>
      <p class="subtitle">Preencha os seus dados e selecione o horário pretendido</p>

      <form id="bookingForm">
        <!-- GRELHA 2 POR 2 -->
        <div class="form-grid-2x2">
          <div class="form-group">
            <label for="nome">NOME COMPLETO</label>
            <input type="text" id="nome" name="nome" placeholder="Ex: Henrique Castilho" required>
          </div>

          <div class="form-group">
            <label for="telemovel">TELEMÓVEL / WHATSAPP</label>
            <input type="tel" id="telemovel" name="telemovel" placeholder="Ex: 931 961 214" required>
          </div>

          <div class="form-group">
            <label for="servico">SERVIÇO PRETENDIDO</label>
            <select id="servico" name="servico" required>
              <option value="">Selecione um serviço...</option>
              <option value="Corte de Cabelo">Corte de Cabelo</option>
              <option value="Barba">Barba</option>
              <option value="Corte + Barba">Corte + Barba</option>
            </select>
          </div>

          <div class="form-group">
            <label for="barbeiro">BARBEIRO DE PREFERÊNCIA</label>
            <select id="barbeiro" name="barbeiro">
              <option value="Primeiro Disponível">Primeiro Disponível</option>
            </select>
          </div>
        </div>

        <!-- DATA DA RESERVA EM LARGURA COMPLETA -->
        <div class="form-group full-width">
          <label for="data">DATA DA RESERVA</label>
          <input type="date" id="data" name="data" required>
        </div>

        <!-- HORÁRIOS DISPONÍVEIS NO FINAL -->
        <div class="form-group full-width horarios-section">
          <label>HORÁRIOS DISPONÍVEIS</label>
          <p class="info-text">Selecione uma data para ver os horários.</p>
          <div id="horariosContainer" class="horarios-grid"></div>
        </div>

        <button type="submit" class="btn-confirmar">CONFIRMAR AGENDAMENTO</button>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
